# Radio role assignments — installed to /etc/iot-hub/radios.conf
#
# Maps a dongle's USB serial number to the role it plays. The udev rules use
# this to create /dev/zigbee and /dev/thread, so a role follows the physical
# dongle across reboots, replugs and USB port changes. Without it, two dongles
# would swap roles whenever ttyUSB0/ttyUSB1 enumeration order changed.
#
# Format:
#     <usb-serial> = zigbee | thread | ignore
#
# Use "ignore" for a USB-serial device that is not a radio at all, to stop it
# being auto-claimed.
#
# Find the serial of an attached dongle with:
#     detect-radios.sh
#     udevadm info -q property -n /dev/ttyUSB0 | grep ID_SERIAL_SHORT
#
# After editing:
#     sudo udevadm control --reload && sudo udevadm trigger --subsystem-match=tty
#     sudo detect-radios.sh
#
# detect-radios.sh appends an entry automatically the first time it sees a
# single recognised coordinator, so in the common one-dongle case this file
# needs no manual editing.

# Example:
# f620d69ac39aef11aa72ad9061ce3355 = zigbee
