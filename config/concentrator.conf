# Concentrator GPIO configuration — installed to /etc/iot-hub/concentrator.conf
#
# Read by /usr/local/bin/concentrator-reset. Pin numbers are BCM GPIO line
# offsets on the SoC controller, NOT sysfs numbers: do not add the 512 offset
# that older Raspberry Pi kernels used, and do not use physical header pins.
#
# Defaults below are for the RAK2287/RAK5146 Pi HAT, which wires only the
# SX1302/SX1303 reset line.

# SX1302/SX1303 reset. Required.
RESET_PIN=17

# The following are unused on the RAK Pi HAT and are left unset.
#
# Set them when running on a board that wires them — the Semtech CORECELL
# reference design, for example, uses:
#   POWER_EN_PIN=18
#   SX1261_RESET_PIN=22
#   AD5338R_RESET_PIN=13
POWER_EN_PIN=none
SX1261_RESET_PIN=none
AD5338R_RESET_PIN=none

# Hold time for each step of the reset sequence, milliseconds.
PULSE_MS=100

# GPIO controller. Leave unset so it is resolved at runtime by matching the
# SoC device-tree node — the chip index is not stable across Pi models or
# kernel versions (Pi 4: gpiochip0, Pi 5: gpiochip4). Only set this if
# auto-detection fails, and set it to a full path:
#GPIO_CHIP=/dev/gpiochip0
