# Radio role assignments — installed to /etc/iot-hub/radios.conf
#
# Maps a dongle's USB serial number to the role it plays. The udev rules use
# this to create /dev/zigbee and /dev/thread, so a role follows the physical
# dongle across reboots, replugs and USB port changes. Without it, two dongles
# would swap roles whenever ttyUSB0/ttyUSB1 enumeration order changed.
#
# Format:
#     <usb-serial> = zigbee | thread | ignore
#
# "ignore" records that a USB-serial device is not a radio at all. Nothing is
# claimed without an entry here, so it is only useful as a note to yourself.
#
# NOTHING WRITES THIS FILE EXCEPT iot-hub-radio-assign. Prefer it to editing by
# hand: it takes a lock, rejects a role that another radio already holds,
# refreshes udev, regenerates the inventory, and then checks against the
# hardware that /dev/zigbee really points at the radio you named.
#
#     sudo iot-hub-radio-assign <usb-serial> zigbee
#
# Find the serial of an attached dongle with:
#     detect-radios.sh
#     udevadm info -q property -n /dev/ttyUSB0 | grep ID_SERIAL_SHORT
#
# If you do edit this file by hand, apply it yourself afterwards:
#     sudo udevadm control --reload && sudo udevadm trigger --subsystem-match=tty
#     sudo detect-radios.sh
#
# There is no automatic assignment. A recognised coordinator with no entry here
# gets no role symlink — deliberately, so that plugging in a second dongle can
# never move a role off the radio that holds a live network.

# Example:
# f620d69ac39aef11aa72ad9061ce3355 = zigbee
