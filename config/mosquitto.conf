# Mosquitto broker for the IoT Hub — installed to /etc/iot-hub/mqtt/mosquitto.conf
#
# This is the on-device broker that Zigbee2MQTT, the LoRaWAN side and the
# onboarding app all talk to. It is intentionally small: the heavy lifting
# (fan-out, rules, dashboards) belongs in the cloud broker, not on a Pi that is
# also running a LoRaWAN gateway, a Zigbee stack and a camera twin.

# ---------------------------------------------------------------------------
# Local listener.
#
# Bound to loopback ON PURPOSE. An anonymous broker listening on 0.0.0.0 would
# expose — and allow control of — every Zigbee device in the home to anyone on
# the network, which for an image strangers flash onto their own hardware is
# not an acceptable default. Containers reach it over the host network
# namespace, so loopback is sufficient for everything on the device.
#
# To expose it to the LAN, add authentication FIRST:
#   mosquitto_passwd -c /etc/iot-hub/mqtt/passwd <user>
# then replace the two lines below with:
#   listener 1883
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
# ---------------------------------------------------------------------------
listener 1883 127.0.0.1
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# Zigbee2MQTT republishes its full device state on startup; the default 100
# in-flight limit throttles that on a large network.
max_inflight_messages 200

# ---------------------------------------------------------------------------
# Cloud bridge to Chirp — commented out until the hub is provisioned.
#
# Chirp exposes two MQTT connector types (bff/pkg/api/v1/connection/dto.go):
#
#   mqtt_cloud     Chirp IS the broker. It issues generated_username and
#                  generated_password, and the hub connects OUT to it.
#   mqtt_external  Chirp is the CLIENT and dials into a broker you run.
#
# Use mqtt_cloud. A hub sits behind home NAT, so mqtt_external would need a
# public address, a port forward or a tunnel before Chirp could reach it —
# workable for a customer's datacenter broker, wrong for a device in a flat.
# An outbound bridge needs none of that.
#
# This is also why the hub keeps a local broker rather than pointing
# Zigbee2MQTT straight at Chirp. Zigbee2MQTT accepts exactly one MQTT server,
# so aiming it at the cloud would leave nothing on the device able to subscribe
# to Zigbee events without a round trip to the internet — and would stop Zigbee
# working at all whenever the WAN blips. With the bridge, local traffic stays
# local, "cleansession false" queues across an outage and replays on reconnect,
# and cloud credentials live in exactly one place.
#
# Fill in from the connection's configuration (GET /v1/connections):
#   broker_url          -> address
#   generated_username  -> remote_username
#   generated_password  -> remote_password   (returned once, on create)
#   topic_prefix        -> the remote prefix below
#
# connection chirp-cloud
# address <broker_url host>:8883
# bridge_protocol_version mqttv311
# bridge_cafile /mosquitto/config/chirp-ca.crt
# remote_username <generated_username>
# remote_password <generated_password>
# cleansession false
# notifications false
# try_private true
#
# # The remote prefix MUST differ from the local one. Identical prefixes make
# # each side re-publish what it just received, forever — the failure mode the
# # chirp_bridge Go service has today.
# #      local-prefix   remote-prefix
# topic # out 1 zigbee2mqtt/ chirp/<gateway-eui>/zigbee/
# topic # in  1 zigbee2mqtt/ chirp/<gateway-eui>/zigbee/
# ---------------------------------------------------------------------------
