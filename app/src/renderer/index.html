<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!--
          Content Security Policy.

          'unsafe-inline' for style-src is required by Emotion, which MUI uses to
          inject styles at runtime — standard for any MUI/Electron app. Scripts
          get no such allowance, and there is no remote origin in any directive:
          everything this renderer loads is bundled.
        -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'"
        />
        <title>Chirp Hub</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="./src/main.tsx"></script>
    </body>
</html>
